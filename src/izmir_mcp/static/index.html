<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İzmir Asistanı</title>
<meta name="description" content="İzmir'de otobüs, nöbetçi eczane, hava kalitesi ve şehir bilgisini açık veriyle cevaplayan asistan.">
<style>
  :root {
    --bg: #f4f7f8; --surface: #ffffff; --fg: #13232a; --muted: #5a6e76; --line: #d8e2e6;
    --accent: #0a6a86; --accent-ink: #ffffff; --accent-soft: #e1eff4; --error: #a23a2a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f171b; --surface: #17232a; --fg: #e3ecef; --muted: #94a9b1; --line: #2a3a42;
      --accent: #4fb6d3; --accent-ink: #062530; --accent-soft: #163640; --error: #f08a74;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px max(16px, env(safe-area-inset-left)) 12px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header .wrap { max-width: 760px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  main { flex: 1; overflow-y: auto; }
  .log { max-width: 760px; margin: 0 auto; padding: 20px 16px 8px; display: grid; gap: 14px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot.error { color: var(--error); }
  .tools { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tools span { font-size: 12px; color: var(--muted); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .welcome { color: var(--muted); display: grid; gap: 12px; padding-top: 12px; }
  .welcome h2 { margin: 0; color: var(--fg); font-size: 22px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button {
    font: inherit; font-size: 14.5px; text-align: left; cursor: pointer; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px;
  }
  .examples button:hover { border-color: var(--accent); }
  .dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  form {
    border-top: 1px solid var(--line); background: var(--surface);
    padding: 10px max(16px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
  }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 140px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .send {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  .send:disabled { opacity: .5; cursor: default; }
  .foot { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
  .loc-row { max-width: 760px; margin: 0 auto 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .loc-btn {
    font: inherit; font-size: 13px; cursor: pointer; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  }
  .loc-btn { flex: none; white-space: nowrap; }
  .loc-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .places { white-space: normal; margin-top: 12px; display: grid; gap: 8px; }
  .place { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); }
  .place .top { display: flex; gap: 10px; align-items: baseline; }
  .place .num { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .place .name { font-weight: 600; }
  .place .dist { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .place .addr { color: var(--muted); font-size: 13.5px; margin: 2px 0 0 32px; }
  .place .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 32px; }
  .place .acts a { font-size: 13px; text-decoration: none; color: var(--accent); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; background: var(--surface); }
  .place .acts a:hover { border-color: var(--accent); }
  .map { height: 260px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .map-note { font-size: 12px; color: var(--muted); }
  .pin { width: 26px; height: 26px; border-radius: 50%; background: #0a6a86; color: #fff; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4); font: 700 12px/22px system-ui, sans-serif; text-align: center; }
  .me { width: 16px; height: 16px; border-radius: 50%; background: #2f7bf6; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(47,123,246,.3); }
  .leaflet-popup-content a { font-weight: 600; }
  .trip { white-space: normal; margin-top: 12px; display: grid; gap: 10px; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; background: var(--bg); }
  .trip .ends { display: grid; gap: 4px; font-size: 14.5px; }
  .trip .ends b { display: inline-block; width: 18px; color: var(--accent); }
  .trip .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .trip .chips span { font-size: 12.5px; background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
  .trip .go { display: block; text-align: center; text-decoration: none; font-weight: 600; border-radius: 12px;
    padding: 10px 14px; background: var(--accent); color: var(--accent-ink); }
  .trip .map { height: 200px; }
  .pin.b { background: #c2410c; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>İzmir Asistanı</h1>
    <p>İzmir Büyükşehir açık verisiyle otobüs, yol tarifi, nöbetçi eczane ve hava kalitesi bilgisi</p>
  </div>
</header>
<main id="scroll">
  <div class="log" id="log">
    <div class="welcome" id="welcome">
      <h2>Merhaba, ne öğrenmek istersin?</h2>
      <div class="examples">
        <button type="button">Bornova Metro durağına sıradaki otobüs ne zaman?</button>
        <button type="button">Buca'da bugün nöbetçi eczane hangisi?</button>
        <button type="button">Bana en yakın nöbetçi eczane hangisi?</button>
        <button type="button">Bornova'da hava kalitesi nasıl, akşam dışarı çıkılır mı?</button>
        <button type="button">Konak İskele'ye hangi otobüsler yaklaşıyor?</button>
        <button type="button">Bornova'dan Konak'a toplu taşımayla nasıl giderim?</button>
      </div>
    </div>
  </div>
</main>
<form id="form">
  <div class="loc-row">
    <button class="loc-btn" id="loc" type="button" aria-pressed="false">📍 Konumumu kullan</button>
    <span id="locmsg">En yakın eczaneleri sana göre sıralamak için</span>
  </div>
  <div class="bar">
    <textarea id="q" rows="1" maxlength="1000" placeholder="Sorunu yaz…" aria-label="Soru"></textarea>
    <button class="send" id="send" type="submit">Sor</button>
  </div>
  <div class="foot">Varış süreleri tahminidir. Cevaplar yapay zekâ tarafından üretilir.</div>
</form>
<script>
(() => {
  const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
  let userLoc = null;  // {lat, lon}; yalnız bu sayfada tutulur, kaydedilmez
  let leafletReady = null;

  const locBtn = document.getElementById("loc"), locMsg = document.getElementById("locmsg");
  locBtn.addEventListener("click", () => {
    if (userLoc) {
      userLoc = null; locBtn.setAttribute("aria-pressed", "false"); locBtn.textContent = "📍 Konumumu kullan";
      locMsg.textContent = "Konum kapalı"; return;
    }
    if (!navigator.geolocation) { locMsg.textContent = "Tarayıcın konum paylaşmayı desteklemiyor."; return; }
    locMsg.textContent = "Konum alınıyor…";
    navigator.geolocation.getCurrentPosition(pos => {
      userLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      locBtn.setAttribute("aria-pressed", "true"); locBtn.textContent = "📍 Konum açık";
      locMsg.textContent = "Sadece soruları cevaplamak için kullanılır, kaydedilmez. Kapatmak için tekrar bas.";
    }, () => { locMsg.textContent = "Konum izni verilmedi. İlçe adını yazarak da sorabilirsin."; },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });

  function km(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  }
  const fmtKm = d => d == null ? "" : d < 1 ? Math.round(d * 1000) + " m" : d.toFixed(1).replace(".", ",") + " km";
  const ll = p => encodeURIComponent(p.lat + "," + p.lon);
  const showUrl = p => "https://www.google.com/maps/search/?api=1&query=" + ll(p);
  const routeUrl = p => "https://www.google.com/maps/dir/?api=1&destination=" + ll(p) +
    (userLoc ? "&origin=" + ll(userLoc) : "");

  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletReady) return leafletReady;
    leafletReady = new Promise((ok, fail) => {
      const css = document.createElement("link");
      css.rel = "stylesheet"; css.href = LEAFLET + "leaflet.min.css";
      document.head.appendChild(css);
      const js = document.createElement("script");
      js.src = LEAFLET + "leaflet.min.js"; js.onload = ok; js.onerror = fail;
      document.head.appendChild(js);
    });
    return leafletReady;
  }

  const SYS = { metro: "🚇 Metro", izban: "🚆 İZBAN", ferry: "⛴️ Vapur" };
  function renderTrip(el, t) {
    const box = document.createElement("div");
    box.className = "trip";
    const chips = (t.nearby || []).map(n => "<span>" + esc((SYS[n.system] || n.system) + ": " + n.name +
      (n.end === "origin" ? " (başlangıca yakın)" : " (varışa yakın)")) + "</span>").join("");
    box.innerHTML =
      '<div class="ends"><div><b>A</b>' + esc(t.origin.name) + '</div><div><b>B</b>' + esc(t.destination.name) +
      (t.straight_km != null ? ' <span class="map-note">· kuş uçuşu ' + esc(fmtKm(t.straight_km)) + "</span>" : "") +
      "</div></div>" + (chips ? '<div class="chips">' + chips + "</div>" : "") +
      '<div class="map" role="img" aria-label="Başlangıç ve varış haritası"></div>' +
      '<a class="go" href="' + esc(t.maps_url) + '" target="_blank" rel="noopener">🚍 Toplu taşıma seçeneklerini karşılaştır</a>' +
      '<div class="map-note">Google Haritalar seçenekleri sürelerine göre sıralar, en hızlısı en üstte.</div>';
    el.appendChild(box);
    const mapEl = box.querySelector(".map");
    loadLeaflet().then(() => {
      const map = L.map(mapEl, { scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
      const pin = (p, label, cls) => L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "",
        html: '<div class="pin ' + cls + '">' + label + "</div>", iconSize: [26, 26], iconAnchor: [13, 13] }), title: p.name })
        .addTo(map).bindPopup("<b>" + esc(p.name) + "</b>");
      pin(t.origin, "A", ""); pin(t.destination, "B", "b");
      map.fitBounds([[t.origin.lat, t.origin.lon], [t.destination.lat, t.destination.lon]],
        { paddingTopLeft: [56, 36], paddingBottomRight: [32, 36], maxZoom: 15 });
      scroll.scrollTop = scroll.scrollHeight;
    }).catch(() => { mapEl.remove(); });
  }

  function renderPlaces(el, raw, origin) {
    const places = raw.map(p => ({ ...p, d: origin ? km(origin, p) : p.distance_km }))
      .sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9));
    const box = document.createElement("div");
    box.className = "places";
    box.innerHTML = places.map((p, i) =>
      '<div class="place"><div class="top"><span class="num">' + (i + 1) + '</span><span class="name">' + esc(p.name) +
      '</span><span class="dist">' + esc(fmtKm(p.d)) + "</span></div>" +
      (p.address ? '<div class="addr">' + esc(p.address) + "</div>" : "") +
      '<div class="acts">' +
      (p.phone ? '<a href="tel:' + esc(p.phone.replace(/[^\d+]/g, "")) + '">📞 Ara</a>' : "") +
      '<a href="' + esc(showUrl(p)) + '" target="_blank" rel="noopener">🗺️ Haritada göster</a>' +
      '<a href="' + esc(routeUrl(p)) + '" target="_blank" rel="noopener">🧭 Yol tarifi</a>' +
      "</div></div>").join("") +
      '<div class="map" role="img" aria-label="Eczanelerin haritası"></div>' +
      '<div class="map-note">' + (origin ? "Mavi nokta senin konumun. " : "Uzaklıklar ilçe merkezine göre. ") +
      "Bir noktaya basıp yol tarifi alabilirsin.</div>";
    el.appendChild(box);
    const mapEl = box.querySelector(".map");
    loadLeaflet().then(() => {
      const map = L.map(mapEl, { scrollWheelZoom: false });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
      const pts = [];
      places.forEach((p, i) => {
        const icon = L.divIcon({ className: "", html: '<div class="pin">' + (i + 1) + "</div>", iconSize: [26, 26], iconAnchor: [13, 13] });
        L.marker([p.lat, p.lon], { icon, title: p.name }).addTo(map).bindPopup(
          "<b>" + esc(p.name) + "</b>" + (p.d != null ? "<br>" + esc(fmtKm(p.d)) : "") +
          '<br><a href="' + esc(routeUrl(p)) + '" target="_blank" rel="noopener">Yol tarifi al →</a>');
        pts.push([p.lat, p.lon]);
      });
      if (origin) {
        L.marker([origin.lat, origin.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
          title: "Konumun" }).addTo(map).bindPopup("Buradasın");
        pts.push([origin.lat, origin.lon]);
      }
      map.fitBounds(pts, { paddingTopLeft: [56, 40], paddingBottomRight: [32, 40], maxZoom: 15 });
      scroll.scrollTop = scroll.scrollHeight;
    }).catch(() => { mapEl.remove(); });
  }

  const TOOL_NAMES = {
    get_stop_arrivals: "Otobüs varışları", find_pharmacies: "Eczaneler",
    get_air_quality: "Hava kalitesi", get_source_status: "Kaynak durumu", get_announcements: "Duyurular",
    get_transit_directions: "Yol tarifi",
  };
  const log = document.getElementById("log"), scroll = document.getElementById("scroll");
  const form = document.getElementById("form"), q = document.getElementById("q"), send = document.getElementById("send");
  const history = [];
  let busy = false;

  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Basit biçim: **kalın**, satır sonları korunur (white-space: pre-wrap).
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/^#{1,4} /gm, "");

  function add(role, html, extra) {
    document.getElementById("welcome")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + role + (extra ? " " + extra : "");
    el.innerHTML = html;
    log.appendChild(el);
    scroll.scrollTop = scroll.scrollHeight;
    return el;
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    history.push({ role: "user", content: text.trim() });
    add("user", esc(text.trim()));
    const wait = add("bot", '<span class="dots" aria-label="Cevap yazılıyor"><span></span><span></span><span></span></span>');
    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-12), ...(userLoc ? { location: userLoc } : {}) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Bir sorun oluştu, tekrar dener misin?");
      history.push({ role: "assistant", content: data.answer });
      const tools = [...new Set(data.tools || [])].map(t => "<span>" + esc(TOOL_NAMES[t] || t) + "</span>").join("");
      wait.innerHTML = fmt(data.answer) + (tools ? '<div class="tools">' + tools + "</div>" : "");
      if (Array.isArray(data.places) && data.places.length) renderPlaces(wait, data.places, userLoc);
      if (data.trip && data.trip.origin && data.trip.destination) renderTrip(wait, data.trip);
    } catch (e) {
      history.pop();
      wait.classList.add("error");
      wait.textContent = e.message === "Failed to fetch" ? "Sunucuya ulaşılamadı. İnternet bağlantını kontrol et." : e.message;
    } finally {
      busy = false; send.disabled = false; scroll.scrollTop = scroll.scrollHeight; q.focus();
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); const t = q.value; q.value = ""; q.style.height = ""; ask(t); });
  q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  q.addEventListener("input", () => { q.style.height = ""; q.style.height = Math.min(q.scrollHeight, 140) + "px"; });
  document.querySelectorAll(".examples button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
})();
</script>
</body>
</html>
