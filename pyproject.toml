[project]
name = "izmir-mcp"
version = "0.1.0"
description = "İzmir açık verisini (ESHOT, Metro, İZBAN, İZDENİZ, eczaneler) MCP araçları olarak sunan sunucu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "anthropic>=2.8,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
izmir-mcp = "izmir_mcp.server:main"
izmir-mcp-ingest = "izmir_mcp.ingest:main"
izmir-mcp-web = "izmir_mcp.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/izmir_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: gerçek İzmir API'sine istek atar (varsayılan olarak atlanır, -m live ile çalıştır)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
